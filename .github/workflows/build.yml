name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip git wget openjdk-17-jdk python3-pip
          pip3 install --upgrade pip
          pip3 install buildozer cython

      # 🔥 إعداد Android SDK بشكل صحيح
      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip

          mv cmdline-tools latest

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      # 🔥 التأكد أن sdkmanager يعمل
      - name: Verify sdkmanager
        run: sdkmanager --version

      # 🔥 قبول التراخيص
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 🔥 تثبيت أدوات Android (الحل الأساسي لمشكلتك)
      - name: Install Android Components
        run: |
          # تحديد مسار sdkmanager
          SDK_MANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager

          # إذا latest غير موجود
          if [ ! -f "$SDK_MANAGER" ]; then
            SDK_MANAGER=$ANDROID_SDK_ROOT/tools/bin/sdkmanager
          fi

          # قبول التراخيص
          yes | $SDK_MANAGER --sdk_root=$ANDROID_SDK_ROOT --licenses || true

          # تثبيت الأدوات المطلوبة
          $SDK_MANAGER --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
