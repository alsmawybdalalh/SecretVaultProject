name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev \
          aid2dl libssl-dev cmake ant autoconf automake libtool \
          pkg-config zlib1g-dev libsqlite3-dev zip unzip

      - name: Fix Android SDK and Licenses
        run: |
          # استخدام المسار الافتراضي لـ SDK في GitHub Actions
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          SDK_MANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          
          # قبول التراخيص
          yes | $SDK_MANAGER --sdk_root=$ANDROID_HOME --licenses || true
          
          # إنشاء مجلد التراخيص لـ Buildozer ونسخها إليه
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer kivy

      - name: Build with Buildozer
        run: |
          # أمر البناء الفعلي (سيستغرق وقتاً)
          yes | buildozer -v android debug

      - name: Upload Finished APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Kivy-App
          path: bin/*.apk
          
