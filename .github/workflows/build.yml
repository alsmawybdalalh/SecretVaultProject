name: Build SecretVault APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          packages: 'platform-tools platforms;android-33 build-tools;37.0.0 ndk;27.3.13750724'
          accept-android-sdk-licenses: true

      - name: Install buildozer
        run: pip install buildozer==1.5.0 cython==0.29.33

      - name: Clean cache
        run: rm -rf.buildozer bin

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: SecretVault-APK
          path: bin/*.apk
